<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hollow Universe · Galaxy map · Concept Known</title>
<link rel="stylesheet" href="style.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>

<div id="stage">
  <canvas id="gl"></canvas>
  <canvas id="cells"></canvas>
  <canvas id="fx"></canvas>
  <div id="vignette"></div>
  <div id="markers"></div>
  <svg id="leader" aria-hidden="true"><line x1="0" y1="0" x2="0" y2="0"/></svg>
  <div id="labels"></div>
</div>

<!-- System level, Simple view: concept A's row of worlds -->
<div id="simple"></div>

<div id="ui">
  <!-- Top left: where you are -->
  <nav id="crumbs" class="glass" aria-label="Location"></nav>
  <div id="levelcap"><span id="levelname"></span><span id="levelsub"></span></div>

  <!-- Left: the four zoom levels -->
  <div id="rail" class="glass" aria-label="Zoom level">
    <div class="rail-track"><div class="rail-fill"></div></div>
    <div class="rail-thumb"></div>
    <button class="rail-stop" data-level="0"><i></i><span>Galaxy</span></button>
    <button class="rail-stop" data-level="1"><i></i><span>Region</span></button>
    <button class="rail-stop" data-level="2"><i></i><span>Neighbourhood</span></button>
    <button class="rail-stop" data-level="3"><i></i><span>System</span></button>
  </div>

  <!-- Top centre (System level only): Simple or Realistic, and the Realistic view's clock (Hollow's system map) -->
  <div id="topcentre">
    <div id="sysmode" class="seg glass" role="tablist" aria-label="System view">
      <span class="seg-thumb"></span>
      <button data-v="simple" role="tab" title="Simple: a calm row of worlds (V)">Simple</button>
      <button data-v="realistic" role="tab" title="Realistic: orbits, moons and time (V)">Realistic</button>
    </div>
    <div id="sm-time" class="hcard" aria-label="Time"></div>
  </div>

  <!-- System level, Realistic view: Hollow's left column (system card and bodies list) and its key hints -->
  <div id="sm-left">
    <section id="sm-sys" class="hcard"></section>
    <section id="sm-bodies" class="hcard"></section>
  </div>
  <div id="sm-keys" class="hcard"><span><kbd>Drag</kbd>Rotate</span><span><kbd>Wheel</kbd>Zoom</span><span><kbd>Click</kbd>Select</span><span><kbd>Double-click</kbd>Focus</span><span><kbd>Space</kbd>Pause</span><span><kbd>,</kbd><kbd>.</kbd>Time speed</span><span><kbd>L</kbd>Scale</span><span><kbd>V</kbd>Simple</span><span><kbd>Esc</kbd>Galaxy map</span></div>

  <!-- Top right: ship status, drones and the search pill -->
  <div id="topright">
    <button id="shipcard" class="glass" title="Centre on me (C)"></button>
    <button id="dronebtn" class="glass" title="Drones (E)"></button>
    <button id="searchpill" class="glass" title="Search (/)">
      <svg class="mag" viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.6" cy="8.6" r="5.6" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m12.8 12.8 4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span>Search or ask “finds”</span><kbd>/</kbd>
    </button>
  </div>
  <div id="dronepanel" class="glass" aria-label="Drones"></div>
  <div id="reports" aria-live="polite"></div>

  <!-- Right: inspector -->
  <aside id="inspector" class="glass"><div id="insp-scroll"></div></aside>

  <!-- Bottom: filters (the first five are also the legend of the tiles) -->
  <div id="chips" class="glass" role="toolbar" aria-label="Filters"></div>
  <div id="hint"><span>Scroll to zoom</span><i></i><span>Drag to tilt and turn</span><i></i><span>Right-drag to pan</span><i></i><span><kbd>/</kbd> to search</span><i></i><span><kbd>E</kbd> drones</span></div>

  <!-- Bottom right: camera -->
  <div id="tools">
    <div class="toolgroup glass">
      <button id="btn-top" class="tool" title="Top view (V)"><svg viewBox="0 0 16 16"><rect x="2.6" y="2.6" width="10.8" height="10.8" rx="2.6" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="8" cy="8" r="1.6" fill="currentColor"/></svg></button>
      <button id="btn-me" class="tool" title="Centre on me (C)"><svg viewBox="0 0 16 16"><path d="M13.6 2.4 2.6 7l4.6 1.6L8.8 13.2Z" fill="currentColor"/></svg></button>
    </div>
    <div class="toolgroup glass">
      <button id="btn-in" class="tool" title="Zoom in (+)"><svg viewBox="0 0 16 16"><path d="M8 3.5v9M3.5 8h9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
      <button id="btn-out" class="tool" title="Zoom out (−)"><svg viewBox="0 0 16 16"><path d="M3.5 8h9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
    </div>
  </div>

  <!-- Bottom left: scale and data note -->
  <div id="footer">
    <div id="scale"><div id="scalebar"></div><span id="scaletxt"></span></div>
    <div id="note">Stars and planets: Hollow's generator. <span class="mock">What you know, finds and drones are mock.</span></div>
  </div>

  <div id="hovercard"></div>
  <div id="chooser" role="listbox" aria-label="Stars under the cursor"></div>
  <div id="toast"></div>

  <!-- Search: concept A's big panel, opened by the pill or "/" -->
  <div id="scrim"></div>
  <div id="top" role="search">
    <div class="search-row">
      <svg class="mag" viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.6" cy="8.6" r="5.6" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m12.8 12.8 4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <input id="q" type="text" placeholder="Search any star by name, or ask “finds”, “nearest fuel”" autocomplete="off" spellcheck="false" aria-label="Search the galaxy">
      <button id="qclear" class="qclear" aria-label="Clear search" tabindex="-1"><svg viewBox="0 0 16 16"><path d="m4.5 4.5 7 7m0-7-7 7" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></button>
      <kbd class="qkey">esc</kbd>
    </div>
    <div id="panel" class="panel"></div>
  </div>

  <div id="loading"><div class="spinner"></div><span>Charting what you know</span></div>
</div>

<!-- data: the real generator's output, then the mock layers -->
<script src="../data/local.js"></script>
<script src="../data/galaxy.js"></script>
<script src="../data/mock.js"></script>
<!-- the engine-free search, intents and route planner (window.HD); no stations, hazards only -->
<script src="data.js"></script>
<!-- MOCK: what you know (bases, trips, drone surveys and finds, stars seen from home) (window.HOLLOW_KNOWLEDGE) -->
<script src="knowledge.js"></script>
<!-- the star field: known stars as points, unknown ones as haze (window.HollowStars) -->
<script src="stars.js"></script>
<!-- every known star gets a shape: Voronoi cells merged into at most ~200 tiles (window.HollowTiles); d3-delaunay -->
<script src="https://cdn.jsdelivr.net/npm/d3-delaunay@6.0.4/dist/d3-delaunay.min.js"></script>
<script src="tiles.js"></script>
<script src="app.js"></script>
<script type="module">
import * as THREE from 'three';
import { Line2 } from 'three/addons/lines/Line2.js';
import { LineMaterial } from 'three/addons/lines/LineMaterial.js';
import { LineGeometry } from 'three/addons/lines/LineGeometry.js';
window.HollowMap.start({ THREE, Line2, LineMaterial, LineGeometry });
</script>
</body>
</html>
